version: "3.8"

services:
  tobira-node-1:
    build:
      context: .
    container_name: tobira-node-1
    command: ["-id", "node-1", "-port", "8080", "-peers", "tobira-node-2:8081,tobira-node-3:8082,tobira-node-4:8083"]
    ports:
      - "8080:8080"
      - "9080:9080/udp"
    networks:
      - tobira-net

  tobira-node-2:
    build:
      context: .
    container_name: tobira-node-2
    command: ["-id", "node-2", "-port", "8081", "-peers", "tobira-node-1:8080,tobira-node-3:8082,tobira-node-4:8083"]
    ports:
      - "8081:8081"
      - "9081:9081/udp"
    networks:
      - tobira-net

  tobira-node-3:
    build:
      context: .
    container_name: tobira-node-3
    command: ["-id", "node-3", "-port", "8082", "-peers", "tobira-node-1:8080,tobira-node-2:8081,tobira-node-4:8083"]
    ports:
      - "8082:8082"
      - "9082:9082/udp"
    networks:
      - tobira-net

  tobira-node-4:
    build:
      context: .
    container_name: tobira-node-4
    command: ["-id", "node-4", "-port", "8083", "-peers", "tobira-node-1:8080,tobira-node-2:8081,tobira-node-3:8082"]
    ports:
      - "8083:8083"
      - "9083:9083/udp"
    networks:
      - tobira-net

  tobira-dashboard:
    build:
      context: ./web
    container_name: tobira-dashboard
    ports:
      - "3000:3000"
    networks:
      - tobira-net
    depends_on:
      - tobira-node-1
      - tobira-node-2
      - tobira-node-3
      - tobira-node-4

networks:
  tobira-net:
    driver: bridge
