name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: set up go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: build
      run: go build -v ./...

    - name: test
      run: go test -v ./...

    - name: benchmark
      run: go test -bench=. -run=^$ ./internal/limiter
